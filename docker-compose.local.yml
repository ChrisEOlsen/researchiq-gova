# Local dev only. Run with:
#   docker compose --env-file .env.local -f docker-compose.local.yml up -d --build
# The --env-file flag matters: Compose separately auto-loads a literal
# ".env" (now the *production* file) to resolve ${VAR} placeholders in
# this YAML itself (port mapping, project name below) -- that's a
# different mechanism than the env_file: lines, which do control what
# the containers actually see. Passing --env-file makes both layers use
# .env.local, so nothing here ever reads production values.
name: ${APP_NAME:-my-gova-app}

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./src:/src
      - ./data:/data
      - ./logs:/logs
    env_file: .env.local
    environment:
      # The container's internal port always stays 8080 regardless of
      # .env.local's APP_PORT -- that variable only controls the host-side
      # port mapping above. Without this override, the app listens on
      # whatever APP_PORT says internally too, which stops matching the
      # fixed :8080 half of the port mapping the instant APP_PORT != 8080.
      - APP_PORT=8080

  # Dedicated container for the gova-builder MCP server, decoupled from the
  # app container's lifecycle. `docker compose restart app` (needed after
  # every Go code change) kills any `docker exec` sessions in that
  # container — including a long-lived MCP stdio connection. Running the
  # MCP server here instead means it survives app restarts indefinitely.
  builder:
    build: .
    # Keep-alive process only — the MCP client invokes mcp-server itself
    # fresh via `docker exec` on each connection (same as it always did
    # for the app container). This just needs to stay running as a
    # stable exec target, independent of the app service's restarts.
    command: ["sleep", "infinity"]
    volumes:
      - ./src:/src
      - ./data:/data
    env_file: .env.local
