<section class="section">
  <h2 class="section-heading">{{.Heading}}</h2>
  <div class="table-wrap">
    <table class="comparison-table">
      <thead><tr><th>{{.ColA}}</th><th>{{.ColB}}</th></tr></thead>
      <tbody>
        {{range .Rows}}<tr><td>{{.A}}</td><td>{{.B}}</td></tr>{{end}}
      </tbody>
    </table>
  </div>
</section>
