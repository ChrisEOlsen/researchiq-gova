<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,300;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'IBM Plex Sans',sans-serif; background:#f6f8f7; color:#14333c; line-height:1.6; padding:2rem 1rem; }
.container { max-width:860px; margin:0 auto; display:flex; flex-direction:column; gap:2rem; }
header { animation:fadeIn 0.4s ease both; border-bottom:2px solid #dce3e1; padding-bottom:1.5rem; }
header h1 { font-family:'Spectral',serif; font-size:2rem; font-weight:500; color:#14333c; line-height:1.2; margin-bottom:0.5rem; }
.subtitle { color:#5a7178; font-size:1rem; }
.section { animation:fadeIn 0.4s ease both; background:#fff; border:1px solid #dce3e1; border-radius:12px; padding:1.5rem; }
.section-heading { font-family:'Spectral',serif; font-size:1.25rem; font-weight:600; color:#14333c; margin-bottom:1rem; }
.bar-chart { display:flex; flex-direction:column; gap:0.75rem; }
.bar-row { display:grid; grid-template-columns:10rem 1fr 3.5rem; align-items:center; gap:0.75rem; }
.bar-label { font-size:0.875rem; color:#14333c; }
.bar-track { background:#eef2f1; border-radius:4px; height:1.25rem; overflow:hidden; }
.bar-fill { background:#0e7a63; height:100%; border-radius:4px; }
.bar-value { font-size:0.875rem; font-weight:600; color:#0e7a63; text-align:right; }
.annotation { margin-top:0.75rem; font-size:0.875rem; color:#5a7178; font-family:'Spectral',serif; font-style:italic; }
.step-list { list-style:none; display:flex; flex-direction:column; gap:0.75rem; }
.step-item { display:flex; align-items:flex-start; gap:1rem; }
.step-num { flex-shrink:0; width:2rem; height:2rem; background:#14333c; color:#f6f8f7; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.875rem; }
.step-title { display:block; font-weight:600; color:#14333c; margin-bottom:0.25rem; }
.step-body { font-size:0.9rem; color:#5a7178; }
.table-wrap { overflow-x:auto; }
.comparison-table { width:100%; border-collapse:collapse; font-size:0.95rem; }
.comparison-table th { text-align:left; padding:0.625rem 0.75rem; background:#eef2f1; border:1px solid #dce3e1; font-weight:600; color:#14333c; }
.comparison-table td { padding:0.625rem 0.75rem; border:1px solid #dce3e1; vertical-align:top; color:#14333c; }
.comparison-table tr:hover td { background:#f6f8f7; }
.cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; }
.card { background:#f6f8f7; border:1px solid #dce3e1; border-radius:8px; padding:1rem; }
.badge { display:inline-block; font-size:0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:#14333c; background:#fde85c; border-radius:4px; padding:0.2rem 0.5rem; margin-bottom:0.5rem; }
.card-title { display:block; font-weight:600; color:#14333c; margin-bottom:0.5rem; font-size:0.95rem; }
.card-body { font-size:0.875rem; color:#5a7178; line-height:1.5; }
.timeline { display:flex; flex-direction:column; }
.timeline-event { display:grid; grid-template-columns:5rem 1fr; gap:1rem; padding:1rem 0 1rem 1.5rem; border-left:2px solid #dce3e1; position:relative; }
.timeline-event::before { content:''; position:absolute; left:-5px; top:1.25rem; width:8px; height:8px; background:#0e7a63; border-radius:50%; }
.timeline-year { font-weight:600; color:#0e7a63; font-size:0.875rem; padding-top:0.1rem; }
.timeline-title { display:block; font-weight:600; color:#14333c; margin-bottom:0.25rem; }
.timeline-body { font-size:0.875rem; color:#5a7178; }
footer { text-align:center; color:#5a7178; font-family:'Spectral',serif; font-style:italic; font-size:0.875rem; padding-top:1rem; border-top:1px solid #dce3e1; }
@media (max-width:600px) {
  header h1 { font-size:1.5rem; }
  .bar-row { grid-template-columns:1fr; gap:0.25rem; }
  .cards-grid { grid-template-columns:1fr; }
  .timeline-event { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>{{.Title}}</h1>
    {{if .Subtitle}}<p class="subtitle">{{.Subtitle}}</p>{{end}}
  </header>
  <main>{{.BodyContent}}</main>
  <footer><p>Based on peer-reviewed research</p></footer>
</div>
</body>
</html>
