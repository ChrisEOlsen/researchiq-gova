<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-bg text-text font-sans min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm space-y-6">
    <div class="text-center mb-8">
      <a href="/" class="font-display text-2xl font-bold text-text no-underline">ResearchIQ</a>
      <p class="text-text-muted text-sm mt-2">Create your free account</p>
    </div>
    <div class="bg-surface border border-border rounded-lg p-6 space-y-4">
      <div id="error-msg" class="hidden border border-red-200 bg-red-50 text-red-700 text-sm px-4 py-3 rounded"></div>
      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-text mb-1">Full name</label>
          <input type="text" id="name" name="name" required
            class="block w-full border border-border rounded px-3 py-2 text-sm text-text focus:outline-none focus:border-primary transition-colors">
        </div>
        <div>
          <label class="block text-sm font-medium text-text mb-1">Email</label>
          <input type="email" id="email" name="email" required
            class="block w-full border border-border rounded px-3 py-2 text-sm text-text focus:outline-none focus:border-primary transition-colors">
        </div>
        <div>
          <label class="block text-sm font-medium text-text mb-1">Password</label>
          <input type="password" id="password" name="password" required minlength="8"
            class="block w-full border border-border rounded px-3 py-2 text-sm text-text focus:outline-none focus:border-primary transition-colors">
        </div>
        <div>
          <label class="block text-sm font-medium text-text mb-1">Confirm password</label>
          <input type="password" id="password_confirm" name="password_confirm" required minlength="8"
            class="block w-full border border-border rounded px-3 py-2 text-sm text-text focus:outline-none focus:border-primary transition-colors">
        </div>
        <button type="submit"
          class="w-full px-4 py-2.5 bg-primary text-white text-sm font-medium rounded hover:bg-primary-hover transition-colors">
          Create account
        </button>
      </form>
    </div>
    <p class="text-center text-sm text-text-muted mt-5">
      Already have an account?
      <a href="/login" class="text-primary font-medium no-underline">Sign in</a>
    </p>
  </div>
  <script type="module" src="/static/js/register.js"></script>
</body>
</html>
