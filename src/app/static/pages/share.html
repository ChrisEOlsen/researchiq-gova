<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Research</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta property="og:title" content="ResearchIQ — Shared Research">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="bg-bg text-text font-sans min-h-screen flex flex-col">
  <nav class="bg-surface border-b border-border relative">
    <div class="max-w-[900px] mx-auto px-4 h-[52px] flex items-center justify-between">

  <main class="flex-1 w-full max-w-[900px] mx-auto px-4 py-10">
    <div id="app" class="flex items-center justify-center py-24">
      <span class="inline-block w-7 h-7 rounded-full border-[3px] border-border border-t-primary animate-spin" aria-label="Loading"></span>
