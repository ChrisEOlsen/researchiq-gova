name: ${APP_NAME:-my-gova-app}

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./src:/src
      - ./data:/data
      - ./logs:/logs
      # entrypoint.sh runs `go build` on every container start (so bind-
      # mounted source changes take effect without a full image rebuild).
      # Without a persistent GOCACHE, that's a full CGO recompile from
      # scratch every time -- the go-sqlite3 C bindings alone take real
      # wall-clock time. A named volume survives container recreation
      # (unlike the container's own writable layer, which `--build`
      # always discards), so unchanged code gets an incremental build.
      - go-build-cache:/root/.cache/go-build
    env_file: .env
    environment:
      # The container's internal port always stays 8080 regardless of
      # .env's APP_PORT -- that variable only controls the host-side
      # port mapping above. Without this override, the app listens on
      # whatever APP_PORT says internally too, which stops matching the
      # fixed :8080 half of the port mapping the instant APP_PORT != 8080.
      - APP_PORT=8080

  # Dedicated container for the gova-builder MCP server, decoupled from the
  # app container's lifecycle. `docker compose restart app` (needed after
  # every Go code change) kills any `docker exec` sessions in that
  # container — including a long-lived MCP stdio connection. Running the
  # MCP server here instead means it survives app restarts indefinitely.
  builder:
    build: .
    # Keep-alive process only — the MCP client invokes mcp-server itself
    # fresh via `docker exec` on each connection (same as it always did
    # for the app container). This just needs to stay running as a
    # stable exec target, independent of the app service's restarts.
    command: ["sleep", "infinity"]
    volumes:
      - ./src:/src
      - ./data:/data
    env_file: .env

  # Cloudflare Tunnel — production only. Not present in
  # docker-compose.local.yml, which is what local dev actually runs, so a
  # local `docker compose up` can never accidentally start a second
  # connector for the real production tunnel token. The ingress rule
  # (researchiq.ai -> http://app:8080) lives on the Cloudflare dashboard,
  # not here — this container just needs to resolve "app" via Docker's
  # default network DNS, which it does automatically by being in the same
  # compose project as the app service.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ${APP_NAME}-tunnel
    command: tunnel run
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - default

volumes:
  go-build-cache:
